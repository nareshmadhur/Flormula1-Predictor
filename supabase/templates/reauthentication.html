<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Flormula1 verification code</title>
  </head>
  <body style="margin:0;background:#070b16;color:#e5e7eb;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#070b16;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;border:1px solid #243047;border-radius:26px;background:#111827;overflow:hidden;">
            <tr><td style="background:linear-gradient(135deg,#dc2626,#111827 58%,#f97316);padding:4px;"></td></tr>
            <tr>
              <td style="padding:34px 30px;">
                <p style="margin:0 0 12px;color:#f97316;font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;">Flormula1</p>
                <h1 style="margin:0 0 18px;color:#ffffff;font-size:30px;line-height:1.12;font-style:italic;">Verification code</h1>
                <p style="margin:0 0 18px;color:#cbd5e1;font-size:16px;line-height:1.6;">Use this code to continue.</p>
                <p style="margin:0 0 24px;border:1px solid #334155;border-radius:18px;background:#020617;color:#ffffff;font-size:34px;font-weight:800;letter-spacing:0.24em;text-align:center;padding:18px 14px;">{{ .Token }}</p>
                <p style="margin:0;color:#64748b;font-size:13px;line-height:1.6;">Do not share this code with anyone.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
